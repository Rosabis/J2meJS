<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="style/indexkaios.css">


    <!-- Required for non-UTF encodings --> 
    <script src="libs/encoding.js"></script>
    <!-- Load config scripts separately because compiled-method-cache.js
       - depends on them. -->
    <script type="text/javascript" src="config/default.js" defer></script>
    <script type="text/javascript" src="config/runtests.js" defer></script>
    <script type="text/javascript" src="config/build.js" defer></script>
    <script type="text/javascript" src="config/urlparams.js" defer></script>


  <script type="text/javascript" src="bld/native.js" defer></script>

  <script type="text/javascript" src="bld/j2me.js" defer></script>
  <script type="text/javascript" src="bld/main-all.js" defer></script>

</head>

<body> 
  
  <div id="applist">
    
  </div>

  <input id="jarFileupload" type="file" style="visibility: hidden;display:none;" accept=".jar"/>
    <div id="menu" style="display: none;">
        <div  id="menucontent">
          <div id="menuheader">
            菜单
          </div>
          
         <div id="menuitems">
          <div class="menuitem" focusable>关于</div>

          <div  class="menuitem"  focusable>退出</div>

        </div>
        </div>
    </div>

    <div id="alertDialog" style="display: none;">
      <div  id="alertcontent">
        <div id="alertheader">
          提示
        </div>
        
        <div id="alerttext">提示信息</div>
  
      </div>

    </div>  
    
    <div id="softkeys">
      <div id="softkeyleft" onclick="softleft()">菜单</div>
      <div id="softkeycenter"></div>
      <div id="softkeyright" onclick="softright()">退出</div>
    </div> 


 
  <script type="text/javascript" src="./js/focusable-core.js"></script>
    <script type="text/javascript" src="./index.js"></script>
</body>
</html>
