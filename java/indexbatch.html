	<style>
		#startup-loader {
			position: fixed;
			inset: 0;
			z-index: 99999;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #ffffff;
			color: #4f5965;
			opacity: 1;
			visibility: visible;
			transition: opacity .35s ease, visibility .35s ease;
		}

		#startup-loader.is-hidden {
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
		}

		#startup-loader .loader-inner {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 26px;
			font-family: "Segoe UI", Arial, sans-serif;
		}

		#startup-loader .loader-word {
			--loader-char-size: clamp(20px, 7.6vw, 64px);
			--loader-char-gap: clamp(3px, 1.4vw, 10px);
			display: flex;
			gap: var(--loader-char-gap);
			align-items: center;
			justify-content: center;
			flex-wrap: nowrap;
			white-space: nowrap;
			max-width: 96vw;
		}

		#startup-loader .loader-char {
			width: var(--loader-char-size);
			height: var(--loader-char-size);
			display: inline-flex;
			align-items: center;
			justify-content: center;
			border-radius: 8px;
			background: #59616c;
			color: #ffffff;
			font-size: calc(var(--loader-char-size) * 0.68);
			font-weight: 700;
			line-height: 1;
			--loader-bounce: calc(var(--loader-char-size) * 0.18);
			box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
			animation: startup-bounce 1.05s ease-in-out infinite;
		}

		#startup-loader .loader-char:nth-child(1) {
			animation-delay: .00s;
			transform: rotate(-10deg);
			color: #6fd8f2;
		}

		#startup-loader .loader-char:nth-child(2) {
			animation-delay: .08s;
			transform: rotate(-10deg);
			color: #6fd8f2;
		}

		#startup-loader .loader-char:nth-child(3) {
			animation-delay: .16s;
		}

		#startup-loader .loader-char:nth-child(4) {
			animation-delay: .24s;
		}

		#startup-loader .loader-char:nth-child(5) {
			animation-delay: .32s;
		}

		#startup-loader .loader-char:nth-child(6) {
			animation-delay: .40s;
		}

		#startup-loader .loader-char:nth-child(7) {
			animation-delay: .48s;
		}

		#startup-loader .loader-char:nth-child(8) {
			animation-delay: .56s;
		}

		#startup-loader .loader-subtitle {
			font-size: 36px;
			font-weight: 600;
			letter-spacing: .01em;
			color: #5b646e;
			line-height: 1.1;
			text-align: center;
		}

		@media (prefers-color-scheme: dark) {
			#startup-loader {
				background: #111318;
				color: #d7dce4;
			}

			#startup-loader .loader-char {
				background: #4f5561;
				color: #f2f4f8;
			}

			#startup-loader .loader-char:nth-child(1),
			#startup-loader .loader-char:nth-child(2) {
				color: #7be4ff;
			}

			#startup-loader .loader-subtitle {
				color: #c6ccd6;
			}
		}

		@keyframes startup-bounce {

			0%,
			100% {
				transform: translateY(0);
			}

			50% {
				transform: translateY(calc(-1 * var(--loader-bounce, 12px)));
			}
		}

		/* From Uiverse.io by BlackisPlay */
		#ghost {
			position: relative;
			scale: 0.8;
		}

		#red {
			animation: upNDown infinite 0.5s;
			position: relative;
			width: 120px;
			height: 120px;
			display: grid;
			grid-template-columns: repeat(14, 1fr);
			grid-template-rows: repeat(14, 1fr);
			grid-column-gap: 0px;
			grid-row-gap: 0px;
			grid-template-areas:
				"a1  a2  a3  a4  a5  top0  top0  top0  top0  a10 a11 a12 a13 a14"
				"b1  b2  b3  top1 top1 top1 top1 top1 top1 top1 top1 b12 b13 b14"
				"c1 c2 top2 top2 top2 top2 top2 top2 top2 top2 top2 top2 c13 c14"
				"d1 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 d14"
				"e1 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 e14"
				"f1 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 f14"
				"top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
				"top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
				"top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
				"top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
				"top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
				"top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
				"st0 st0 an4 st1 an7 st2 an10 an10 st3 an13 st4 an16 st5 st5"
				"an1 an2 an3 an5 an6 an8 an9 an9 an11 an12 an14 an15 an17 an18";
		}

		@keyframes upNDown {

			0%,
			49% {
				transform: translateY(0px);
			}

			50%,
			100% {
				transform: translateY(-10px);
			}
		}

		#top0,
		#top1,
		#top2,
		#top3,
		#top4,
		#st0,
		#st1,
		#st2,
		#st3,
		#st4,
		#st5 {
			background-color: red;
		}

		#top0 {
			grid-area: top0;
		}

		#top1 {
			grid-area: top1;
		}

		#top2 {

		}

		#top3 {

		}

		#top4 {

		}

		#st0 {
			grid-area: st0;
		}

		#st1 {
			grid-area: st1;
		}

		#st2 {
			grid-area: st2;
		}

		#st3 {
			grid-area: st3;
		}

		#st4 {

		}

		#st5 {
			grid-area: st5;
		}

		#an1 {
			grid-area: an1;
			animation: flicker0 infinite 0.5s;
		}

		#an18 {
			grid-area: an18;
			animation: flicker0 infinite 0.5s;
		}

		#an2 {
			grid-area: an2;
			animation: flicker1 infinite 0.5s;
		}

		#an17 {
			grid-area: an17;
			animation: flicker1 infinite 0.5s;
		}

		#an3 {
			grid-area: an3;
			animation: flicker1 infinite 0.5s;
		}

		#an16 {
			grid-area: an16;
			animation: flicker1 infinite 0.5s;
		}

		#an4 {
			grid-area: an4;
			animation: flicker1 infinite 0.5s;
		}

		#an15 {
			grid-area: an15;
			animation: flicker1 infinite 0.5s;
		}

		#an6 {
			grid-area: an6;
			animation: flicker0 infinite 0.5s;
		}

		#an12 {
			grid-area: an12;
			animation: flicker0 infinite 0.5s;
		}

		#an7 {
			grid-area: an7;
			animation: flicker0 infinite 0.5s;
		}

		#an13 {
			grid-area: an13;
			animation: flicker0 infinite 0.5s;
		}

		#an9 {
			grid-area: an9;
			animation: flicker1 infinite 0.5s;
		}

		#an10 {
			grid-area: an10;
			animation: flicker1 infinite 0.5s;
		}

		#an8 {
			grid-area: an8;

		}

		#an11 {
			grid-area: an11;
			animation: flicker0 infinite 0.5s;
		}

		@keyframes flicker0 {

			0%,
			49% {
				background-color: red;
			}

			50%,
			100% {
				background-color: transparent;
			}
		}

		@keyframes flicker1 {

			0%,
			49% {
				background-color: transparent;
			}

			50%,
			100% {
				background-color: red;
			}
		}

		#eye {
			width: 40px;
			height: 50px;
			position: absolute;
			top: 30px;
			left: 10px;
		}

		#eye::before {
			content: "";
			background-color: white;
			width: 20px;
			height: 50px;
			transform: translateX(10px);
			display: block;
			position: absolute;
		}

		#eye::after {
			content: "";
			background-color: white;
			width: 40px;
			height: 30px;
			transform: translateY(10px);
			display: block;
			position: absolute;
		}

		#eye1 {
			width: 40px;
			height: 50px;
			position: absolute;
			top: 30px;
			right: 30px;
		}

		#eye1::before {
			content: "";
			background-color: white;
			width: 20px;
			height: 50px;
			transform: translateX(10px);
			display: block;
			position: absolute;
		}

		#eye1::after {
			content: "";
			background-color: white;
			width: 40px;
			height: 30px;
			transform: translateY(10px);
			display: block;
			position: absolute;
		}

		#pupil {
			width: 20px;
			height: 20px;
			background-color: blue;
			position: absolute;
			top: 50px;
			left: 10px;
			z-index: 1;
			animation: eyesMovement infinite 3s;
		}

		#pupil1 {
			width: 20px;
			height: 20px;
			background-color: blue;
			position: absolute;
			top: 50px;
			right: 50px;
			z-index: 1;
			animation: eyesMovement infinite 3s;
		}

		@keyframes eyesMovement {

			0%,
			49% {
				transform: translateX(0px);
			}

			50%,
			99% {
				transform: translateX(10px);
			}

			100% {
				transform: translateX(0px);
			}
		}

		#shadow {
			background-color: black;
			width: 140px;
			height: 140px;
			position: absolute;
			border-radius: 50%;
			transform: rotateX(80deg);
			filter: blur(20px);
			top: 80%;
			animation: shadowMovement infinite 0.5s;
		}

		@keyframes shadowMovement {

			0%,
			49% {
				opacity: 0.5;
			}

			50%,
			100% {
				opacity: 0.2;
			}
		}
	</style>
	<script>
		window.hideStartupLoader = function () {

			if (!loader || loader.classList.contains('is-hidden')) return;
			loader.classList.add('is-hidden');
			setTimeout(function () {
				if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
			}, 420);
		};
	</script>

	<script>
		loadVersionedPage('indexbatch', function (err) {
			window.hideStartupLoader();
			if (err) console.error(err);
			(function () {
				var topBar = document.getElementById('topAppBar');
				var largeTitle = document.getElementById('topBarLargeTitle');
				var smallTitle = document.getElementById('topBarSmallTitle');

				function tabTitles() {
					return { games: (window.I18n?I18n.t('title.batch'):'批量安装版'), settings: (window.I18n?I18n.t('title.settings'):'设置') };
				}

				window.switchTab = function (tabName) {
					document.querySelectorAll('.tab-view').forEach(function (t) { t.classList.remove('active'); });
					document.querySelectorAll('.bottom-nav-item').forEach(function (b) { b.classList.remove('active'); });
					document.querySelectorAll('.rail-item').forEach(function (r) { r.classList.remove('active'); });
					var tab = document.getElementById('tab-' + tabName);
					if (tab) tab.classList.add('active');
					var btn = document.querySelector('.bottom-nav-item[data-tab="' + tabName + '"]');
					if (btn) btn.classList.add('active');
					var rail = document.querySelector('.rail-item[data-tab="' + tabName + '"]');
					if (rail) rail.classList.add('active');
					if (tabTitles()[tabName]) {
						largeTitle.textContent = tabTitles()[tabName];
						smallTitle.textContent = tabTitles()[tabName];
					}
					var fab = document.getElementById('fab');
					if (fab) fab.classList.toggle('hidden', tabName !== 'games');
					var detail = document.getElementById('desktopDetail');
					var appBar = document.getElementById('topAppBar');
					var layout = document.querySelector('.page-layout');
					var hideDetail = tabName !== 'games';
					if (detail) detail.classList.toggle('hidden', hideDetail);
					if (appBar) appBar.classList.toggle('no-detail', hideDetail);
					if (layout) layout.classList.toggle('no-detail', hideDetail);
					window.scrollTo({ top: 0 });
				};

				var _urlParams = new URLSearchParams(window.location.search);
				var _initTab = _urlParams.get('tab');
				if (_initTab) switchTab(_initTab);

				var _scrolled = false;
				window.addEventListener('scroll', function () {
					var y = window.pageYOffset;
					if (!_scrolled && y > 30) {
						_scrolled = true;
						topBar.classList.add('scrolled');
					} else if (_scrolled && y < 5) {
						_scrolled = false;
						topBar.classList.remove('scrolled');
					}
				}, { passive: true });
			})();
