  <!-- 阻止 iOS 页面拖动 -->
  <script>
    // 阻止 iOS Safari 的橡皮筋滚动效果
    document.addEventListener('touchmove', function (e) {
      // 允许在可交互元素上滚动（如输入框、对话框等）
      var target = e.target;
      while (target && target !== document.body) {
        if (target.scrollHeight > target.clientHeight ||
          target.tagName === 'INPUT' ||
          target.tagName === 'TEXTAREA' ||
          target.contentEditable === 'true' ||
          target.classList.contains('text-editor') ||
          target.closest('form[role="dialog"]')) {
          return; // 允许这些元素滚动
        }
        target = target.parentElement;
      }
      // 阻止其他地方的滚动
      e.preventDefault();
    }, { passive: false });

    // 阻止双击缩放
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
      var now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, false);
  </script>

  <style>
    #startup-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #4f5965;
      opacity: 1;
      visibility: visible;
      transition: opacity .35s ease, visibility .35s ease;
    }

    #startup-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #startup-loader .loader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    #startup-loader .loader-word {
      --loader-char-size: clamp(20px, 7.6vw, 64px);
      --loader-char-gap: clamp(3px, 1.4vw, 10px);
      display: flex;
      gap: var(--loader-char-gap);
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      white-space: nowrap;
      max-width: 96vw;
    }

    #startup-loader .loader-char {
      width: var(--loader-char-size);
      height: var(--loader-char-size);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #59616c;
      color: #ffffff;
      font-size: calc(var(--loader-char-size) * 0.68);
      font-weight: 700;
      line-height: 1;
      --loader-bounce: calc(var(--loader-char-size) * 0.18);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
      animation: startup-bounce 1.05s ease-in-out infinite;
    }

    #startup-loader .loader-char:nth-child(1) {
      animation-delay: .00s;
      transform: rotate(-10deg);
      color: #6fd8f2;
    }

    #startup-loader .loader-char:nth-child(2) {
      animation-delay: .08s;
      transform: rotate(-10deg);
      color: #6fd8f2;
    }

    #startup-loader .loader-char:nth-child(3) {
      animation-delay: .16s;
    }

    #startup-loader .loader-char:nth-child(4) {
      animation-delay: .24s;
    }

    #startup-loader .loader-char:nth-child(5) {
      animation-delay: .32s;
    }

    #startup-loader .loader-char:nth-child(6) {
      animation-delay: .40s;
    }

    #startup-loader .loader-char:nth-child(7) {
      animation-delay: .48s;
    }

    #startup-loader .loader-char:nth-child(8) {
      animation-delay: .56s;
    }

    #startup-loader .loader-subtitle {
      font-size: 36px;
      font-weight: 600;
      letter-spacing: .01em;
      color: #5b646e;
      line-height: 1.1;
      text-align: center;
    }

    @media (prefers-color-scheme: dark) {
      #startup-loader {
        background: #111318;
        color: #d7dce4;
      }

      #startup-loader .loader-char {
        background: #4f5561;
        color: #f2f4f8;
      }

      #startup-loader .loader-char:nth-child(1),
      #startup-loader .loader-char:nth-child(2) {
        color: #7be4ff;
      }

      #startup-loader .loader-subtitle {
        color: #c6ccd6;
      }
    }

    @keyframes startup-bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(calc(-1 * var(--loader-bounce, 12px)));
      }
    }

    .screen {
      display: none;
    }

    #download-screen.screen.screen-canvas-overlay {
      display: flex !important;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      box-sizing: border-box;
      padding: 12px;
      background: rgba(255, 255, 255, 0.92);
    }

    @media (prefers-color-scheme: dark) {
      #download-screen.screen.screen-canvas-overlay {
        background: rgba(28, 28, 30, 0.92);
      }
    }

    #keypad {
      visibility: hidden;
    }

    /* From Uiverse.io by BlackisPlay */
    #ghost {
      position: relative;
      scale: 0.8;
    }

    #red {
      animation: upNDown infinite 0.5s;
      position: relative;
      width: 120px;
      height: 120px;
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      grid-template-rows: repeat(14, 1fr);
      grid-column-gap: 0px;
      grid-row-gap: 0px;
      grid-template-areas:
        "a1  a2  a3  a4  a5  top0  top0  top0  top0  a10 a11 a12 a13 a14"
        "b1  b2  b3  top1 top1 top1 top1 top1 top1 top1 top1 b12 b13 b14"
        "c1 c2 top2 top2 top2 top2 top2 top2 top2 top2 top2 top2 c13 c14"
        "d1 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 d14"
        "e1 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 e14"
        "f1 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 top3 f14"
        "top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
        "top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
        "top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
        "top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
        "top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
        "top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4 top4"
        "st0 st0 an4 st1 an7 st2 an10 an10 st3 an13 st4 an16 st5 st5"
        "an1 an2 an3 an5 an6 an8 an9 an9 an11 an12 an14 an15 an17 an18";
    }

    @keyframes upNDown {

      0%,
      49% {
        transform: translateY(0px);
      }

      50%,
      100% {
        transform: translateY(-10px);
      }
    }

    #top0,
    #top1,
    #top2,
    #top3,
    #top4,

    #st1,
    #st2,

    }

      animation: flicker1 infinite 0.5s;
    }

    #an8 {

      animation: flicker0 infinite 0.5s;
    }

    #an11 {
      grid-area: an11;
      animation: flicker0 infinite 0.5s;
    }

    @keyframes flicker0 {

      0%,
      49% {
        background-color: red;
      }

      50%,
      100% {
        background-color: transparent;
      }
    }

    @keyframes flicker1 {

      0%,
      49% {
        background-color: transparent;
      }

      50%,
      100% {
        background-color: red;
      }
    }

    #eye {
      width: 40px;
      height: 50px;
      position: absolute;
      top: 30px;
      left: 10px;
    }

    #eye::before {
      content: "";
      background-color: white;
      width: 20px;
      height: 50px;
      transform: translateX(10px);
      display: block;
      position: absolute;
    }

    #eye::after {
      content: "";
      background-color: white;
      width: 40px;
      height: 30px;
      transform: translateY(10px);
      display: block;
      position: absolute;
    }

    #eye1 {
      width: 40px;
      height: 50px;
      position: absolute;
      top: 30px;
      right: 30px;
    }

    #eye1::before {
      content: "";
      background-color: white;
      width: 20px;
      height: 50px;
      transform: translateX(10px);
      display: block;
      position: absolute;
    }

    #eye1::after {
      content: "";
      background-color: white;
      width: 40px;
      height: 30px;
      transform: translateY(10px);
      display: block;
      position: absolute;
    }

    #pupil {
      width: 20px;
      height: 20px;
      background-color: blue;
      position: absolute;
      top: 50px;
      left: 10px;
      z-index: 1;
      animation: eyesMovement infinite 3s;
    }

    #pupil1 {
      width: 20px;
      height: 20px;
      background-color: blue;
      position: absolute;
      top: 50px;
      right: 50px;
      z-index: 1;
      animation: eyesMovement infinite 3s;
    }

    @keyframes eyesMovement {

      0%,
      49% {
        transform: translateX(0px);
      }

      50%,
      99% {
        transform: translateX(10px);
      }

      100% {
        transform: translateX(0px);
      }
    }

    #shadow {
      background-color: black;
      width: 140px;
      height: 140px;
      position: absolute;
      border-radius: 50%;
      transform: rotateX(80deg);
      filter: blur(20px);
      top: 80%;
      animation: shadowMovement infinite 0.5s;
    }

    @keyframes shadowMovement {

      0%,
      49% {
        opacity: 0.5;
      }

      50%,
      100% {
        opacity: 0.2;
      }
    }

  <script>
    window.hideStartupLoader = function () {
      var loader = document.getElementById('startup-loader');
      if (!loader || loader.classList.contains('is-hidden')) return;
      loader.classList.add('is-hidden');
      setTimeout(function () {
        if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
      }, 420);
    };
  </script>

          <input type="text" placeholder="Type SMS Here">
          <p class="timeLeft"></p>
          <progress class="timeLeftBar" value="0" max="100"></progress>
        </section>
        <menu>
          <button class="cancel">Cancel</button>
          <button class="recommend">Done</button>
        </menu>
      </form>

      <form role="dialog" data-type="confirm" class="nokia-fileui-prompt" id="nokia-fileui-prompt" style="display: none">
        <section>
          <h1>Select a file</h1>
          <p><input type="file" name="nokia-fileui-file">
        </p></section>
        <menu>
          <button class="cancel">Cancel</button>
          <button class="recommend">Done</button>
        </menu>
      </form>

      <form role="dialog" data-type="confirm" class="download-failure-dialog" id="download-failure-dialog" style="display: none">
        <section>
          <h1 class="download-dialog-text">Download failure</h1>
          <p>The download of midlet failed. Press <i>Retry</i> to try again.</p>
        </section>
        <menu>
          <button class="recommend">Retry</button>
        </menu>
      </form>
    </div>
  </div>
  </main>

  <!-- 遮罩层容器，用于放置弹出的 Alert/TextBox -->
  <div id="lcdui-overlay-container"></div>
  <footer id="keypad" class="row-reverse" onselectstart="return false" oncontextmenu="return false" aria-label="虚拟键盘" data-i18n-aria="player.keypad">
    <div id="joypad">

      <div id="right" class="key" role="button" tabindex="-1">▶</div><br>
      <div class="key" style="visibility:hidden"></div>
      <div id="down" class="key" role="button" tabindex="-1">▼</div>
      <div id="exit" class="key" role="button" tabindex="-1">挂断</div>
    </div>
    <div id="numpad">
      <div id="num1" class="key" role="button" tabindex="-1">1</div>
      <div id="num2" class="key" role="button" tabindex="-1">2</div>
      <div id="num3" class="key" role="button" tabindex="-1">3</div>

      <div id="num4" class="key" role="button" tabindex="-1">4</div>
      <div id="num5" class="key" role="button" tabindex="-1">5</div>
      <div id="num6" class="key" role="button" tabindex="-1">6</div>
      <div id="num0" class="key numpad2" role="button" tabindex="-1">0</div>
      <br>
      <div id="num7" class="key" role="button" tabindex="-1">7</div>
      <div id="num8" class="key" role="button" tabindex="-1">8</div>
      <div id="num9" class="key" role="button" tabindex="-1">9</div>
      <div id="pound" class="key numpad2" role="button" tabindex="-1">#</div>
      <br>
      <div id="star" class="key numpad" role="button" tabindex="-1">*</div>
      <div id="num0" class="key numpad" role="button" tabindex="-1">0</div>
      <div id="pound" class="key numpad" role="button" tabindex="-1">#</div>
    </div>
  </footer>
