		<div class="section-card about-one-screen">
			<div class="about-main-copy">
				<p class="about-epigraph" data-i18n="about.epigraph">有些欢喜藏在按键声里；多年后再点开，仿佛与年少的自己，隔着屏幕轻轻击掌。</p>
				<p class="about-lead" data-i18n="about.lead">紫星 · J2ME 在线模拟器</p>
				<p class="about-text" data-i18n="about.p1">在浏览器里，让那些以为留在过去的老游戏，还能再被打开一遍——不必翻箱倒柜找旧手机，也不必向谁解释，你为何还记得那个名字。兼容与体验仍在打磨；若有卡顿或闪退，欢迎留言，我们还在路上。</p>
				<p class="about-text" data-i18n="about.p2">两人小团队维护，无资本加持，只靠一点情怀，和「还想把它做好」的执念。若你在此打发过片刻无聊，或找回过通关的得意，于我而言，都已足够。</p>
			</div>
			<div class="about-tip-block">
				<div class="about-tip-copy">
					<p class="about-tip-line" data-i18n="about.tip">域名与服务器都是实实在在的成本。若你愿意用一杯奶茶的心意，托住这份还在更新的坚持，可以扫下方赞赏码；随心即可，不必勉强。</p>
					<p class="about-tip-note" data-i18n="about.tipNote">心意已到，也祝你今日愉快。</p>
				</div>
				<div class="about-tip-figure">

				</div>
